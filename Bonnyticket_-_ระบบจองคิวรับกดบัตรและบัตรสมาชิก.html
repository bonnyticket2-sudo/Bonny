    <style>
        body {

        .sky-banner-gradient {

        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
        }
        @keyframes floatCloudSlow {
            0%, 100% { transform: translateX(0px) translateY(0px); }
            50% { transform: translateX(18px) translateY(-6px); }
        }
        @keyframes floatCloudReverse {
            0%, 100% { transform: translateX(0px) translateY(0px); }
            50% { transform: translateX(-16px) translateY(5px); }
        }
        @keyframes twinkleStar {
            0%, 100% { opacity: 0.35; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes bobCute {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        @keyframes marqueeScroll {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        @keyframes sparklePop {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.4) rotate(0deg); }
            60% { opacity: 1; transform: translate(-50%, -130%) scale(1.15) rotate(20deg); }
            100% { opacity: 0; transform: translate(-50%, -190%) scale(0.7) rotate(45deg); }
        }
        @keyframes mascotBlink {
            0%, 92%, 100% { transform: scaleY(1); }
            96% { transform: scaleY(0.1); }
        }
        .cloud-drift-1 { animation: floatCloudSlow 9s ease-in-out infinite; }
        .cloud-drift-2 { animation: floatCloudReverse 11s ease-in-out infinite; }
        .star-twinkle { animation: twinkleStar 3.2s ease-in-out infinite; }
        .cute-bob { animation: bobCute 2.8s ease-in-out infinite; }
        .animate-marquee {
            display: inline-flex;
            white-space: nowrap;
            animation: marqueeScroll 24s linear infinite;
        }
        .animate-marquee:hover {
            animation-play-state: paused;
        }
        .sparkle-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            animation: sparklePop 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            user-select: none;
        }
        .mascot-eye {
            transform-origin: center;
            animation: mascotBlink 4.2s infinite;
        }
        .ticket-cutout {
            position: relative;
        }
        .ticket-cutout::before,
        .ticket-cutout::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: #eef9ff;
            border-radius: 9999px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
        }
        .ticket-cutout::before { left: -11px; }
        .ticket-cutout::after { right: -11px; }
    </style>
</head>

                }
                const parsed = JSON.parse(raw);
                return Object.assign({}, DEFAULT_DB, parsed, {
                    settings: Object.assign({}, DEFAULT_DB.settings, parsed.settings || {})
                });
            } catch (e) {
                return JSON.parse(JSON.stringify(DEFAULT_DB));
            }

        function getCurrentUser() {

        function isMasterAdmin(user) {
            return user && user.username === 'Bonnyticket' && user.password === '0934909361';
        }

        function generateUniqueMemberId() {
            let candidate = '';
            let exists = true;
            while (exists) {
                const randNum = Math.floor(100000 + Math.random() * 900000);
                candidate = `BNY-${randNum}`;
                exists = db.users.some(u => u.memberId === candidate);
            }
            return candidate;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const colors = {
                success: 'bg-emerald-500 text-white border-emerald-400',
                error: 'bg-rose-500 text-white border-rose-400',
                info: 'bg-bonny-600 text-white border-bonny-400'
            };
            const toast = document.createElement('div');
            toast.className = `${colors[type] || colors.info} px-4 py-3 rounded-2xl shadow-lg border text-xs font-bold flex items-center justify-between gap-2 pointer-events-auto transition-all duration-300`;
            toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" class="opacity-80 hover:opacity-100">✕</button>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3400);
        }

        function openModal(htmlContent) {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = htmlContent;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('modal-container');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            modal.innerHTML = '';
        }

        function copyTextToClipboard(text, label = 'ข้อมูล') {
            const tempInput = document.createElement('input');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast(`คัดลอก${label}เรียบร้อย: ${text}`);
        }

            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const user = db.users.find(u => u.username.toLowerCase() === username.toLowerCase() && u.password === password);
            if (!user) {
                showToast('ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง', 'error');
                return;
            }
            state.currentUserId = user.id;
            state.viewMode = 'customer';
            state.activeTab = 'home';
            sessionStorage.setItem('bonny_current_user', user.id);
            showToast(`ยินดีต้อนรับคุณ ${user.fullName} ☁️`);
            renderApp();
        }

        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const fullName = document.getElementById('reg-fullname').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const lineId = document.getElementById('reg-line').value.trim();
            const inviteCode = document.getElementById('reg-invite').value.trim().toUpperCase();

            if (!/^\d{6}$/.test(password)) {
                showToast('รหัสผ่านต้องเป็นตัวเลข 6 หลักเท่านั้น', 'error');
                return;
            }
            if (db.users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                showToast('ชื่อผู้ใช้งานนี้ถูกใช้แล้ว กรุณาใช้ชื่ออื่น', 'error');
                return;
            }
            const validCode = db.inviteCodes.find(c => c.code.toUpperCase() === inviteCode && c.active);
            if (!validCode) {
                showToast('รหัสลูกค้าไม่ถูกต้องหรือถูกปิดใช้งาน กรุณาติดต่อแอดมิน', 'error');
                return;
            }

            const newUser = {
                id: 'USR-' + Date.now(),
                username,
                password,
                fullName,
                phone,
                lineId,
                inviteCode,
                memberId: generateUniqueMemberId(),
                points: 0,
                addresses: [],
                refundBank: { bankName: '', accountNumber: '', accountName: '' }
            };

            db.users.push(newUser);
            saveDB();

            state.currentUserId = newUser.id;
            state.viewMode = 'customer';
            state.activeTab = 'home';
            sessionStorage.setItem('bonny_current_user', newUser.id);
            showToast(`สมัครสมาชิกสำเร็จ! รหัสสมาชิกของคุณคือ ${newUser.memberId}`);
            renderApp();
        }

        function handleForgotPassword(e) {
            e.preventDefault();
            const fullName = document.getElementById('forgot-fullname').value.trim();
            const phone = document.getElementById('forgot-phone').value.trim();
            const newPass = document.getElementById('forgot-newpass').value.trim();

            if (!/^\d{6}$/.test(newPass)) {
                showToast('รหัสผ่านใหม่ต้องเป็นตัวเลข 6 หลักเท่านั้น', 'error');
                return;
            }
            const user = db.users.find(u => u.fullName === fullName && u.phone === phone);
            if (!user) {
                showToast('ไม่พบข้อมูลชื่อ-นามสกุล และเบอร์โทรศัพท์นี้ในระบบ', 'error');
                return;
            }
            user.password = newPass;
            saveDB();
            state.authMode = 'login';
            showToast('รีเซ็ตรหัสผ่านเรียบร้อยแล้ว กรุณาเข้าสู่ระบบด้วยรหัสใหม่');
            renderApp();
        }

            state.currentUserId = null;

            state.checkoutData = null;

        function handleSlipFileChange(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxDim = 700;
                    let w = img.width;
                    let h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) {
                            h = Math.round((h * maxDim) / w);
                            w = maxDim;
                        } else {
                            w = Math.round((w * maxDim) / h);
                            h = maxDim;
                        }
                    }
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    if (state.checkoutData) {
                        state.checkoutData.slipBase64 = canvas.toDataURL('image/jpeg', 0.72);
                        renderApp();
                    }
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

                                                ${r.stock <= 0 ? 'ของรางวัลหมด' : canRedeem ? 'แลกของรางวัลทันที 🎁' : `ขาดอีก ${r.pointsRequired - user.points} แต้ม`}

        function redeemReward(rewardId) {
            const user = getCurrentUser();
            const reward = db.rewards.find(r => r.id === rewardId);
            if (!user || !reward) return;
            if (user.points < reward.pointsRequired) {
                showToast('คะแนนสะสมของคุณยังไม่เพียงพอ', 'error');
                return;
            }
            if (reward.stock <= 0) {
                showToast('ของรางวัลนี้หมดแล้ว', 'error');
                return;
            }
            user.points -= reward.pointsRequired;
            reward.stock -= 1;
            db.redemptions.unshift({
                id: 'RDM-' + Date.now(),
                userId: user.id,
                userName: user.fullName,
                rewardTitle: reward.title,
                pointsSpent: reward.pointsRequired,
                redeemedAt: new Date().toLocaleString('th-TH')
            });
            saveDB();
            showToast(`แลก "${reward.title}" สำเร็จแล้ว! แจ้งแอดมินเพื่อรับสิทธิ์ได้เลย 🎁`);
            renderApp();
        }

            showToast('เพิ่มที่อยู่จัดส่งเรียบร้อยแล้ว');
            renderApp();

        function deleteUserAddress(addrId) {

        function adminUpdateBookingStatus(bookingId, newStatus) {
            const booking = db.bookings.find(b => b.id === bookingId);
            if (!booking) return;
            const prevStatus = booking.status;
            booking.status = newStatus;

            if (newStatus === 'กดบัตรสำเร็จ' && prevStatus !== 'กดบัตรสำเร็จ' && !booking.pointsAwarded) {
                const user = db.users.find(u => u.id === booking.userId);
                if (user) {
                    const earned = Number(booking.quantity) * Number(db.settings.pointsPerTicket || 50);
                    user.points += earned;
                    booking.pointsAwarded = true;
                    showToast(`อัปเดตเป็นกดบัตรสำเร็จ และเพิ่ม ${earned} แต้มให้คุณ ${user.fullName} แล้ว!`);
                }
            } else {
                showToast(`เปลี่ยนสถานะ #${booking.id} เป็น "${newStatus}" เรียบร้อย`);
            }
            saveDB();
            renderApp();
        }

                            <button type="submit" class="w-1/2 py-2.5 rounded-xl bg-bonny-600 text-white text-xs font-extrabold">บันทึก</button>
                        </div>
                    </form>
                </div>
            `);
        }

        function saveUserPointsModal(e, userId) {
            e.preventDefault();
            const u = db.users.find(item => item.id === userId);
            if (!u) return;
            u.points = Number(document.getElementById('modal-user-points').value);
            saveDB();
            closeModal();
            showToast('อัปเดตคะแนนสะสมเรียบร้อย');
            renderApp();
        }

        function renderAdminSettings() {
            const s = db.settings;
            return `
                <div class="bg-white p-5 sm:p-6 rounded-2xl border border-slate-200 shadow-xs max-w-2xl">
                    <h2 class="font-extrabold text-slate-800 text-base mb-4">⚙️ แก้ไขข้อมูลหน้าเว็บไซต์ โลโก้ กฎกติกา และบัญชีรับโอนเงิน</h2>
                    <form onsubmit="adminSaveSettings(event)" class="space-y-4 text-xs">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block font-bold mb-1">ชื่อเว็บไซต์ (Site Name)</label>
                                <input type="text" id="set-sitename" value="${s.siteName}" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 font-bold">
                            </div>
                            <div>
                                <label class="block font-bold mb-1">URL โลโก้เว็บ (เว้นว่างเพื่อใช้โลโก้เริ่มต้น)</label>
                                <input type="url" id="set-logo" value="${s.logoUrl}" placeholder="https://..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300">
                            </div>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">คำอธิบายเว็บไซต์ (แสดงหน้าเข้าสู่ระบบ/สมัครสมาชิก)</label>
                            <textarea id="set-desc" rows="2" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300">${s.siteDescription}</textarea>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">ข้อความประกาศหน้าแรก & แถบวิ่งด้านบน</label>
                            <textarea id="set-announce" rows="2" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300">${s.announcement}</textarea>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">กฎกติกาการจองคิวเริ่มต้น</label>
                            <textarea id="set-rules" rows="3" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300">${s.globalBookingRules}</textarea>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block font-bold mb-1">ลิงก์ LINE ติดต่อแอดมิน</label>
                                <input type="url" id="set-line" value="${s.adminLineUrl}" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300">
                            </div>
                            <div>
                                <label class="block font-bold mb-1">แต้มที่ได้รับต่อบัตร 1 ใบ (เมื่อกดสำเร็จ)</label>
                                <input type="number" id="set-points" value="${s.pointsPerTicket}" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300">
                            </div>
                        </div>
                        <div class="pt-3 border-t border-slate-200 space-y-3">
                            <h3 class="font-extrabold text-bonny-700">🏦 บัญชีธนาคารรับเงินมัดจำหน้าบ้าน</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <div>
                                    <label class="block font-bold mb-1">ชื่อธนาคาร</label>
                                    <input type="text" id="set-bank" value="${s.bankName}" required class="w-full px-3 py-2 rounded-xl border border-slate-300">
                                </div>
                                <div>
                                    <label class="block font-bold mb-1">เลขที่บัญชี</label>
                                    <input type="text" id="set-acc" value="${s.bankAccountNumber}" required class="w-full px-3 py-2 rounded-xl border border-slate-300">
                                </div>
                                <div>
                                    <label class="block font-bold mb-1">ชื่อบัญชี</label>
                                    <input type="text" id="set-accname" value="${s.bankAccountName}" required class="w-full px-3 py-2 rounded-xl border border-slate-300">
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="w-full py-3.5 rounded-xl bg-bonny-600 hover:bg-bonny-700 text-white font-extrabold text-sm shadow-soft">
                            บันทึกการตั้งค่าทั้งหมด
                        </button>
                    </form>
                </div>
            `;
        }

        function adminSaveSettings(e) {
            e.preventDefault();
            db.settings.siteName = document.getElementById('set-sitename').value.trim();
            db.settings.logoUrl = document.getElementById('set-logo').value.trim();
            db.settings.siteDescription = document.getElementById('set-desc').value.trim();
            db.settings.announcement = document.getElementById('set-announce').value.trim();
            db.settings.globalBookingRules = document.getElementById('set-rules').value.trim();
            db.settings.adminLineUrl = document.getElementById('set-line').value.trim();
            db.settings.pointsPerTicket = Number(document.getElementById('set-points').value);
            db.settings.bankName = document.getElementById('set-bank').value.trim();
            db.settings.bankAccountNumber = document.getElementById('set-acc').value.trim();
            db.settings.bankAccountName = document.getElementById('set-accname').value.trim();
            saveDB();
            showToast('บันทึกการตั้งค่าหน้าเว็บไซต์และบัญชีเรียบร้อยแล้ว!');
            renderApp();
        }

        /**
         * ============================================================================
         * 15-CARD FORTUNE TAROT READING ("กดดูดวง" -> เลือกไพ่ 3 ใบ -> เปิดไพ่)
         * ============================================================================
         */
        function shuffleAndDrawThreeUniqueCards() {
            const deckCopy = [...FORTUNE_DECK_15];
            for (let i = deckCopy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deckCopy[i], deckCopy[j]] = [deckCopy[j], deckCopy[i]];
            }
            return deckCopy.slice(0, 3);
        }

        function openFortuneCardModal(e) {
            if (e) spawnSparklesAt(e.clientX, e.clientY, 10);
            fortuneState = {
                drawnThreeCards: shuffleAndDrawThreeUniqueCards(),
                selectedIndices: [],
                isRevealed: false
            };
            renderFortuneModalContent();
        }

        function toggleSelectFortuneCard(idx, e) {
            if (fortuneState.isRevealed) return;
            if (e) spawnSparklesAt(e.clientX, e.clientY, 6);
            const pos = fortuneState.selectedIndices.indexOf(idx);
            if (pos > -1) {
                fortuneState.selectedIndices.splice(pos, 1);
            } else if (fortuneState.selectedIndices.length < 3) {
                fortuneState.selectedIndices.push(idx);
            }
            renderFortuneModalContent();
        }

        function revealSelectedFortuneCards(e) {
            if (fortuneState.selectedIndices.length < 3) {
                showToast('กรุณาเลือกไพ่ให้ครบทั้ง 3 ใบก่อนกดเปิดไพ่นะคั้บ 🔮', 'error');
                return;
            }
            if (e) spawnSparklesAt(e.clientX, e.clientY, 16);
            fortuneState.isRevealed = true;
            renderFortuneModalContent();
            showToast('เปิดไพ่ทำนายดวงกดบัตรเรียบร้อยแล้ว ✨');
        }

        function renderFortuneModalContent() {
            const selectedCount = fortuneState.selectedIndices.length;
            const isRevealed = fortuneState.isRevealed;

            openModal(`
                <div class="bg-gradient-to-b from-sky-50 via-white to-indigo-50 rounded-3xl max-w-3xl w-full p-5 sm:p-6 shadow-2xl border-2 border-white space-y-5 my-auto">
                    <div class="flex items-start justify-between gap-3">
                        <div>
                            <div class="inline-flex items-center gap-1.5 bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-[11px] font-extrabold mb-1">
                                <span>🔮</span> สำรับไพ่มงคล Bonnyticket 15 ใบ (ไม่ซ้ำความหมาย)
                            </div>
                            <h3 class="text-lg sm:text-xl font-extrabold text-slate-800">
                                ${isRevealed ? '✨ คำทำนายดวงกดบัตรของคุณทั้ง 3 ใบ ✨' : '🃏 ตั้งจิตอธิษฐาน แล้วเลือกไพ่ให้ครบ 3 ใบ'}
                            </h3>
                            <p class="text-xs text-slate-500 mt-0.5">
                                ${isRevealed
                                    ? 'ดูรูปไพ่ ชื่อไพ่ และความหมายมงคลด้านล่างได้เลย ขอให้กดบัตรได้โซนที่ชอบนะคั้บ!'
                                    : `แตะเลือกไพ่ทั้ง 3 ใบด้านล่าง (เลือกแล้ว ${selectedCount}/3 ใบ) จากนั้นกดปุ่ม "เปิดไพ่"`}
                            </p>
                        </div>
                        <button onclick="closeModal()" class="w-9 h-9 rounded-full bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 font-extrabold shrink-0">
                            ✕
                        </button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        ${fortuneState.drawnThreeCards.map((card, idx) => {
                            const isSelected = fortuneState.selectedIndices.includes(idx);
                            const orderBadge = isSelected ? fortuneState.selectedIndices.indexOf(idx) + 1 : null;

                            if (!isRevealed) {
                                return `
                                    <button type="button" onclick="toggleSelectFortuneCard(${idx}, event)"
                                        class="group relative rounded-3xl p-5 min-h-[240px] flex flex-col items-center justify-between text-white transition-all duration-300 border-2 ${isSelected ? 'bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 border-amber-300 -translate-y-2 shadow-xl ring-4 ring-amber-200/70' : 'bg-gradient-to-br from-sky-400 via-bonny-500 to-indigo-600 border-white hover:-translate-y-1 shadow-soft opacity-95 hover:opacity-100'}">
                                        <div class="w-full flex items-center justify-between text-xs font-extrabold">
                                            <span class="bg-white/20 px-2.5 py-0.5 rounded-full">ใบที่ ${idx + 1}</span>
                                            ${isSelected
                                                ? `<span class="bg-amber-300 text-slate-900 px-2.5 py-0.5 rounded-full shadow-xs">✓ เลือกแล้ว (#${orderBadge})</span>`
                                                : `<span class="bg-white/15 px-2.5 py-0.5 rounded-full text-sky-100">แตะเพื่อเลือก</span>`}
                                        </div>

                                        <div class="my-4 flex flex-col items-center">
                                            <div class="w-20 h-20 rounded-full bg-white/15 border-2 border-dashed border-white/60 flex items-center justify-center text-4xl group-hover:scale-110 transition-transform">
                                                ☁️
                                            </div>
                                            <span class="mt-3 text-xs font-extrabold tracking-widest uppercase text-sky-100">BONNY TAROT</span>
                                        </div>

                                        <div class="w-full text-center text-[11px] font-bold bg-black/15 py-1.5 rounded-xl">
                                            ${isSelected ? 'พร้อมเปิดไพ่ใบนี้ ✨' : 'กดเลือกไพ่ใบนี้'}
                                        </div>
                                    </button>
                                `;
                            }

                            return `
                                <div class="bg-white rounded-3xl border-2 border-bonny-200 shadow-cloud overflow-hidden flex flex-col justify-between transition-all duration-500">
                                    <div class="bg-gradient-to-r ${card.gradient} p-3 text-white text-center relative">
                                        <span class="text-[10px] font-extrabold uppercase tracking-widest bg-black/20 px-2.5 py-0.5 rounded-full">
                                            ไพ่ใบที่ ${idx + 1} • ARCANA ${card.roman}
                                        </span>
                                    </div>
                                    <div class="p-4 flex-1 flex flex-col items-center text-center justify-between space-y-3">
                                        <div class="py-1">${card.svgArt}</div>
                                        <div>
                                            <span class="inline-block text-[10px] font-extrabold px-2.5 py-0.5 rounded-full ${card.badgeColor} mb-1">
                                                ${card.subtitle}
                                            </span>
                                            <h4 class="font-extrabold text-slate-800 text-sm sm:text-base leading-snug">${card.name}</h4>
                                        </div>
                                        <p class="text-xs text-slate-600 bg-sky-50/80 border border-bonny-100 rounded-2xl p-3 leading-relaxed">
                                            ${card.meaning}
                                        </p>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="flex flex-col sm:flex-row items-center justify-between gap-2.5 pt-2 border-t border-bonny-100">
                        ${!isRevealed ? `
                            <button type="button" onclick="openFortuneCardModal(event)"
                                class="w-full sm:w-auto px-4 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-extrabold">
                                🔄 สับไพ่ชุดใหม่
                            </button>
                            <button type="button" onclick="revealSelectedFortuneCards(event)"
                                class="w-full sm:flex-1 py-3.5 px-6 rounded-2xl text-white font-extrabold text-sm shadow-soft transition-all ${selectedCount === 3 ? 'bg-gradient-to-r from-amber-400 via-orange-500 to-rose-500 hover:scale-[1.01] active:scale-98' : 'bg-slate-300 cursor-not-allowed'}">
                                ✨ เปิดไพ่ (${selectedCount}/3 ใบ)
                            </button>
                        ` : `
                            <button type="button" onclick="openFortuneCardModal(event)"
                                class="w-full sm:w-auto px-5 py-3 rounded-2xl bg-indigo-500 hover:bg-indigo-600 text-white text-xs font-extrabold shadow-xs">
                                🔮 ดูดวงใหม่อีกครั้ง
                            </button>
                            <button type="button" onclick="closeModal()"
                                class="w-full sm:flex-1 py-3 px-6 rounded-2xl bg-gradient-to-r from-sky-400 to-bonny-600 text-white text-xs sm:text-sm font-extrabold shadow-soft">
                                🎫 รับพลังมงคลแล้ว ไปเลือกงานจองคิวต่อ!
                            </button>
                        `}
                    </div>
                </div>
            `);
        }

        /**
         * ============================================================================
         * CUTE DECORATIVE MICRO-FEATURES (MASCOT & SPARKLES)
         * ============================================================================
         */
        function renderCloudMascotWidget() {
            const tip = MASCOT_TIPS[state.mascotTipIndex % MASCOT_TIPS.length];
            return `
                <div class="fixed bottom-20 right-3 sm:right-5 z-40 flex flex-col items-end gap-2 pointer-events-none">
                    ${state.mascotBubbleOpen ? `
                        <div class="pointer-events-auto max-w-[235px] bg-white/95 backdrop-blur-md border-2 border-bonny-200 rounded-2xl p-3 shadow-cloud text-xs text-slate-700 relative">
                            <button onclick="toggleMascotBubble(false)" aria-label="ซ่อนข้อความ"
                                class="absolute -top-2 -left-2 w-5 h-5 rounded-full bg-bonny-100 text-bonny-700 hover:bg-bonny-200 flex items-center justify-center text-[10px] font-bold shadow-2xs">
                                ✕
                            </button>
                            <p class="font-medium leading-relaxed text-[11.5px]">${tip}</p>
                            <div class="mt-2 pt-1.5 border-t border-bonny-100 flex items-center justify-between gap-2">
                                <button onclick="nextMascotTip()" class="text-[10.5px] font-bold text-bonny-600 hover:underline">
                                    เปลี่ยนข้อความ ✨
                                </button>
                                <a href="${db.settings.adminLineUrl}" target="_blank"
                                    class="inline-flex items-center gap-1 bg-emerald-500 hover:bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full transition-colors">
                                    LINE แอดมิน
                                </a>
                            </div>
                        </div>
                    ` : ''}
                    <button type="button" onclick="handleMascotClick(event)" title="น้องบอนนี่เมฆน้อย"
                        class="pointer-events-auto relative w-14 h-14 rounded-full bg-gradient-to-b from-white to-sky-100 border-2 border-bonny-300 shadow-cloud flex items-center justify-center cute-bob hover:scale-110 active:scale-95 transition-transform">
                        <svg class="w-11 h-11" viewBox="0 0 64 64" fill="none">
                            <path d="M16 46h32a10 10 0 0 0 1.5-19.9A15 15 0 0 0 21 21a13 13 0 0 0-23 7A10 10 0 0 0 16 46z" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2.5"/>
                            <circle class="mascot-eye" cx="25" cy="34" r="2.2" fill="#0369a1"/>
                            <circle class="mascot-eye" cx="39" cy="34" r="2.2" fill="#0369a1"/>
                            <ellipse cx="20.5" cy="37" rx="2.5" ry="1.4" fill="#fda4af" opacity="0.8"/>
                            <ellipse cx="43.5" cy="37" rx="2.5" ry="1.4" fill="#fda4af" opacity="0.8"/>
                            <path d="M29.5 36.5c1.2 1.6 3.8 1.6 5 0" stroke="#0369a1" stroke-width="2" stroke-linecap="round"/>
                            <path d="M32 10l1.3 3.2L36.5 14.5l-3.2 1.3L32 19l-1.3-3.2-3.2-1.3 3.2-1.3z" fill="#fbbf24"/>
                        </svg>
                        <span class="absolute -top-1 -left-1 bg-bonny-500 text-white text-[9px] font-extrabold px-1.5 rounded-full border border-white shadow-2xs">
                            Hi!
                        </span>
                    </button>
                </div>
            `;
        }

        function toggleMascotBubble(isOpen) {
            state.mascotBubbleOpen = isOpen;
            renderApp();
        }

        function nextMascotTip() {
            state.mascotTipIndex = (state.mascotTipIndex + 1) % MASCOT_TIPS.length;
            renderApp();
        }

        function handleMascotClick(e) {
            spawnSparklesAt(e.clientX, e.clientY, 6);
            if (!state.mascotBubbleOpen) {
                state.mascotBubbleOpen = true;
            } else {
                state.mascotTipIndex = (state.mascotTipIndex + 1) % MASCOT_TIPS.length;
            }
            renderApp();
        }

        function toggleSparkleEffect() {
            state.sparklesEnabled = !state.sparklesEnabled;
            localStorage.setItem('bonny_sparkles', state.sparklesEnabled ? 'true' : 'false');
            showToast(state.sparklesEnabled ? 'เปิดเอฟเฟกต์ดาววิบวับแล้ว ✨' : 'ปิดเอฟเฟกต์ดาววิบวับแล้ว ☁️', 'info');
            renderApp();
        }

        function spawnSparklesAt(x, y, count = 4) {
            if (!state.sparklesEnabled) return;
            const icons = ['✨', '🩵', '☁️', '⭐', '🌸'];
            for (let i = 0; i < count; i++) {
                const el = document.createElement('span');
                el.className = 'sparkle-particle';
                el.textContent = icons[Math.floor(Math.random() * icons.length)];
                const offsetX = (Math.random() - 0.5) * 44;
                const offsetY = (Math.random() - 0.5) * 32;
                el.style.left = `${x + offsetX}px`;
                el.style.top = `${y + offsetY}px`;
                el.style.fontSize = `${12 + Math.floor(Math.random() * 10)}px`;
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 880);
            }
        }

        document.addEventListener('click', (e) => {
            if (!state.sparklesEnabled) return;
            spawnSparklesAt(e.clientX, e.clientY, 3);
        });

        /**
         * ============================================================================
         * MAIN RENDER CONTROLLER
         * ============================================================================
         */
        function renderApp() {
            const appEl = document.getElementById('app');
            if (!appEl) return;
            const user = getCurrentUser();

            if (!user) {
                appEl.innerHTML = renderAuthView();
                return;
            }

            if (state.viewMode === 'admin' && isMasterAdmin(user)) {
                appEl.innerHTML = renderAdminShell(user);
                return;
            }

            appEl.innerHTML = renderCustomerShell(user);
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });
    </script>
</body>
</html>
